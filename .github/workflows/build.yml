# Builds the app on every push and pull request so broken changes show up early.
# The APK is attached to the run as an artifact (Actions tab → the run → Artifacts).
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: usage-guard-apk
          path: app/build/outputs/apk/release/app-release.apk
