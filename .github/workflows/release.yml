# Publishes a GitHub Release with a ready-to-install APK whenever a version tag is pushed:
#   git tag v0.6 && git push origin v0.6
#
# Signing: add these repository secrets (Settings → Secrets and variables → Actions)
# so every release is signed with the same key and testers can update in place:
#   SIGNING_KEYSTORE_BASE64  base64 of your .jks/.keystore file
#   SIGNING_STORE_PASSWORD   keystore password
#   SIGNING_KEY_ALIAS        key alias
#   SIGNING_KEY_PASSWORD     key password
# Without them the APK is signed with a throwaway debug key that changes every run,
# so testers would have to uninstall before installing the next release.
name: Release

on:
  push:
    tags: ["v*"]
  # Or publish from GitHub: Actions → Release → Run workflow, and type the version (e.g. v0.6).
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, e.g. v0.6"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the release key from secrets."
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret. Signing with a throwaway debug key; testers will need to uninstall before the next update."
          fi

      # The APK is for people installing from GitHub; the App Bundle (.aab) is what
      # Google Play accepts. Both are signed with the same key from secrets.
      - name: Build APK and App Bundle
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Name the APK and write release notes
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          APK="UsageGuard-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"
          cp app/build/outputs/bundle/release/app-release.aab "UsageGuard-${TAG}.aab"
          echo "AAB=UsageGuard-${TAG}.aab" >> "$GITHUB_ENV"
          if [ -f "release-notes/${TAG}.md" ]; then
            cp "release-notes/${TAG}.md" notes.md
          else
            echo "Usage Guard ${TAG}" > notes.md
          fi
          cat >> notes.md <<'EOF'

          ---
          **Install:** download the `.apk` below on your Android phone (Android 8 or newer), open it, and allow installing from your browser if asked. Full steps, including the one-time "Allow restricted settings" unlock, are in the [README](https://github.com/${{ github.repository }}#install-on-your-phone).
          EOF

      # The App Bundle goes on the workflow run (Actions → this run → Artifacts), not on the
      # public release: it's only for uploading to Play Console.
      - name: Keep the App Bundle for Play Console
        uses: actions/upload-artifact@v7
        with:
          name: play-store-bundle-${{ env.TAG }}
          path: ${{ env.AAB }}

      - name: Check the bundle can go to Play
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::This App Bundle is signed with a debug key. Google Play will reject it. Add the signing secrets (issue #10) before uploading to Play."
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Usage Guard ${{ env.TAG }}
          body_path: notes.md
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
